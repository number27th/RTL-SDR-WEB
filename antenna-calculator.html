<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTL-SDR Antenna Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Sarabun:wght@300;400;600;700&display=swap');
  :root {
    --bg: #0a0e14; --bg2: #0f1520; --bg3: #151d2e;
    --accent: #00d4ff; --accent2: #ff6b35; --accent3: #39ff14;
    --text: #c8d8e8; --text-dim: #5a7a9a; --border: #1e3050;
    --purple: #c864ff; --yellow: #ffc800;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; padding: 1.5rem; font-size:15px; line-height:1.7;
    background-image: radial-gradient(ellipse at 10% 0%, rgba(0,212,255,0.05) 0%, transparent 50%),
                      radial-gradient(ellipse at 90% 100%, rgba(255,107,53,0.04) 0%, transparent 50%); }

  .page-header { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:1.5rem; }
  .page-logo { font-family:'Share Tech Mono',monospace; font-size:1.8rem; color:var(--accent); letter-spacing:2px; text-shadow: 0 0 20px rgba(0,212,255,0.4); }
  .page-logo span { color:var(--accent2); }
  .page-title { font-size:1rem; font-weight:600; color:#fff; }
  .page-sub { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--text-dim); letter-spacing:1px; }

  .section-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border); }
  .section-num { font-family:'Share Tech Mono',monospace; font-size:0.7rem; padding:0.2rem 0.5rem; border-radius:3px; letter-spacing:2px; background:rgba(57,255,20,0.1); color:var(--accent3); border:1px solid rgba(57,255,20,0.3); }
  .section-title { font-size:1.2rem; font-weight:700; color:#fff; }

  /* ── INPUT AREA ── */
  .calc-box { background:var(--bg2); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .input-area { padding:1.75rem; background:var(--bg3); border-bottom:1px solid var(--border); }

  .input-row { display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
  @media(max-width:700px){ .input-row { grid-template-columns:1fr; } }

  .field-label { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--text-dim); letter-spacing:1.5px; margin-bottom:0.5rem; display:block; }

  .freq-wrap { display:flex; gap:0.5rem; align-items:stretch; }
  .input-wrap { display:flex; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:6px; overflow:hidden; flex:1; transition:border-color 0.2s; }
  .input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,212,255,0.1); }
  .calc-input { background:transparent; border:none; outline:none; color:var(--accent); font-family:'Share Tech Mono',monospace; font-size:1.3rem; padding:0.6rem 1rem; width:100%; }
  .unit-label { font-family:'Share Tech Mono',monospace; font-size:0.8rem; color:var(--text-dim); padding:0 0.75rem; white-space:nowrap; }

  .unit-btns { display:flex; flex-direction:column; gap:0.25rem; }
  .unit-btn { background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.2); border-radius:4px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.7rem; padding:0.25rem 0.6rem; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .unit-btn.active { background:rgba(0,212,255,0.15); color:var(--accent); border-color:var(--accent); }

  .presets { display:flex; flex-wrap:wrap; gap:0.35rem; margin-top:0.75rem; }
  .preset-btn { background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.15); border-radius:4px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.68rem; padding:0.2rem 0.55rem; cursor:pointer; transition:all 0.15s; }
  .preset-btn:hover { background:rgba(0,212,255,0.12); color:var(--accent); border-color:rgba(0,212,255,0.4); }
  .preset-group-label { font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--text-dim); opacity:0.7; align-self:center; }

  /* material selector */
  .mat-selector { display:flex; flex-wrap:wrap; gap:0.4rem; }
  .mat-btn { background:rgba(255,107,53,0.05); border:1px solid rgba(255,107,53,0.2); border-radius:4px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.72rem; padding:0.35rem 0.75rem; cursor:pointer; transition:all 0.15s; }
  .mat-btn.active { background:rgba(255,107,53,0.15); color:var(--accent2); border-color:var(--accent2); }

  /* antenna type selector */
  .type-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:0.5rem; }
  .ant-btn { background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.15); border-radius:6px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.75rem; padding:0.5rem 0.75rem; cursor:pointer; transition:all 0.15s; text-align:center; }
  .ant-btn:hover { background:rgba(0,212,255,0.1); color:var(--text); }
  .ant-btn.active { background:rgba(0,212,255,0.15); color:var(--accent); border-color:var(--accent); box-shadow:0 0 10px rgba(0,212,255,0.2); }
  .ant-btn .ant-tag { font-size:0.6rem; display:block; margin-top:0.15rem; opacity:0.7; }
  .ant-btn .diff { font-size:0.6rem; }

  .rdy-btn { background:rgba(255,200,0,0.05); border:1px solid rgba(255,200,0,0.2); border-radius:6px; color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:0.75rem; padding:0.5rem 0.75rem; cursor:pointer; transition:all 0.15s; text-align:center; }
  .rdy-btn:hover { background:rgba(255,200,0,0.1); color:var(--yellow); }
  .rdy-btn.active { background:rgba(255,200,0,0.15); color:var(--yellow); border-color:var(--yellow); box-shadow:0 0 8px rgba(255,200,0,0.2); }
  .rdy-btn .ant-tag { font-size:0.6rem; display:block; margin-top:0.15rem; opacity:0.7; }
  .rdy-info-title { font-family:'Share Tech Mono',monospace; font-size:0.85rem; color:var(--yellow); margin-bottom:0.75rem; }
  .rdy-row { display:flex; justify-content:space-between; padding:0.35rem 0; border-bottom:1px solid rgba(30,48,80,0.4); font-size:0.85rem; }
  .rdy-row:last-child { border-bottom:none; }
  .rdy-k { color:var(--text-dim); }
  .rdy-v { color:#fff; font-weight:600; text-align:right; }

  /* ── RESULT AREA ── */
  .result-area { padding:1.75rem; display:none; }
  .result-area.show { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
  @media(max-width:900px){ .result-area.show { grid-template-columns:1fr; } }

  .diagram-box { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:1.25rem; min-height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .diagram-title { font-family:'Share Tech Mono',monospace; font-size:0.85rem; color:var(--accent2); margin-bottom:0.75rem; text-align:center; }
  .diagram-box svg { width:100%; max-height:210px; }

  /* wavelength banner */
  .lambda-banner { display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:1rem; }
  .lambda-chip { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:0.4rem 0.85rem; text-align:center; flex:1; min-width:90px; }
  .lambda-chip .lc-label { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--text-dim); letter-spacing:1px; display:block; }
  .lambda-chip .lc-val { font-family:'Share Tech Mono',monospace; font-size:1rem; color:var(--accent); font-weight:700; }

  /* summary */
  .summary-title { font-family:'Share Tech Mono',monospace; font-size:0.75rem; color:var(--accent); letter-spacing:1.5px; margin-bottom:1rem; }
  .summary-table { width:100%; border-collapse:collapse; margin-bottom:1.5rem; }
  .summary-table td { padding:0.55rem 0; border-bottom:1px solid rgba(30,48,80,0.5); font-size:0.88rem; }
  .summary-table tr:last-child td { border-bottom:none; }
  .summary-table .key { color:var(--text-dim); }
  .summary-table .val { color:#fff; font-weight:600; text-align:right; font-family:'Share Tech Mono',monospace; }
  .summary-table .val .unit { font-size:0.78rem; color:var(--accent); margin-left:0.25rem; }

  /* info badges */
  .info-badges { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.25rem; }
  .badge { padding:0.2rem 0.6rem; border-radius:3px; font-family:'Share Tech Mono',monospace; font-size:0.68rem; letter-spacing:0.5px; }
  .badge-imp { background:rgba(200,100,255,0.1); color:var(--purple); border:1px solid rgba(200,100,255,0.3); }
  .badge-diff { background:rgba(57,255,20,0.1); color:var(--accent3); border:1px solid rgba(57,255,20,0.3); }
  .badge-use { background:rgba(0,212,255,0.1); color:var(--accent); border:1px solid rgba(0,212,255,0.3); }

  /* feed point */
  .feed-box { background:var(--bg3); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:0; }
  .feed-box h3 { font-family:'Share Tech Mono',monospace; font-size:0.9rem; color:var(--accent2); padding:0.85rem 1.25rem; background:var(--bg); border-bottom:1px solid var(--border); }
  .feed-box .feed-content { padding:1.25rem; }
  .feed-box p { font-size:0.88rem; color:var(--text-dim); margin-bottom:0.75rem; }
  .feed-box ul { margin:0; padding-left:18px; font-size:0.88rem; }
  .feed-box li { margin-bottom:0.4rem; }
  .feed-box strong { color:var(--accent); }
  .feed-svg-wrap { border-top:1px solid var(--border); padding:1.25rem; }
  .feed-svg-wrap svg { width:100%; max-height:170px; }

  .tip-box { border-left:3px solid var(--accent2); background:rgba(255,107,53,0.05); padding:1rem; margin-top:1.25rem; border-radius:0 4px 4px 0; }
  .tip-box h4 { font-family:'Share Tech Mono',monospace; font-size:0.75rem; color:var(--accent2); margin-bottom:0.65rem; letter-spacing:1px; }

  /* SVG shared classes */
  .dim-line { stroke:var(--accent); stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .dim-arrow { fill:var(--accent); }
  .dim-text { fill:var(--accent); font-family:'Share Tech Mono',monospace; font-size:12px; text-anchor:middle; }
  .ant-el { stroke-width:4; stroke-linecap:round; fill:none; }
  .ant-driven { stroke:var(--accent3); }
  .ant-ref { stroke:var(--text); }
  .ant-dir { stroke:var(--purple); }
  .ant-boom { stroke:var(--text-dim); stroke-width:2; fill:none; }
  .ant-feed { stroke:var(--accent2); stroke-width:2; fill:none; }
  .ant-label { fill:var(--text-dim); font-family:'Sarabun',sans-serif; font-size:11px; text-anchor:middle; }
  .coax-outer { fill:#222; }
  .coax-shield { fill:#888; }
  .coax-diel { fill:#ddd; }
  .coax-center { fill:#d9a443; }
  .wire { stroke:#d9a443; stroke-width:2; fill:none; }
  .wire-sh { stroke:#888; stroke-width:2; fill:none; }
</style>
</head>
<body>

<header class="page-header">
  <div class="page-logo">ANT<span>-CALC</span></div>
  <div>
    <div class="page-title">RTL-SDR Antenna Calculator</div>
    <div class="page-sub">// คำนวณขนาดเสาอากาศ + วิธีต่อสาย + ไดอะแกรม</div>
  </div>
</header>

<section>
  <div class="section-header">
    <span class="section-num">BUILD</span>
    <span class="section-title">เครื่องมือสร้างเสาอากาศแบบ Interactive</span>
  </div>

  <div class="calc-box">
    <div class="input-area">

      <div class="input-row">
        <!-- Frequency -->
        <div>
          <label class="field-label">1. กรอกความถี่เป้าหมาย</label>
          <div class="freq-wrap">
            <div class="input-wrap">
              <input class="calc-input" type="number" id="freqInput" placeholder="145" step="any" value="145">
              <span class="unit-label" id="unitDisplay">MHz</span>
            </div>
            <div class="unit-btns">
              <button class="unit-btn active" id="btnMHz" onclick="setUnit('MHz')">MHz</button>
              <button class="unit-btn" id="btnKHz" onclick="setUnit('kHz')">kHz</button>
            </div>
          </div>
          <div class="presets" style="margin-top:0.6rem">
            <span class="preset-group-label">Sat:</span>
            <button class="preset-btn" onclick="p(137.9)">Meteor 137.9</button>
            <button class="preset-btn" onclick="p(137.1)">Meteor 137.1</button>
            <span class="preset-group-label">Air:</span>
            <button class="preset-btn" onclick="p(1090)">ADS-B 1090</button>
            <button class="preset-btn" onclick="p(121.5)">ฉุกเฉิน 121.5</button>
            <span class="preset-group-label">VHF:</span>
            <button class="preset-btn" onclick="p(144.39)">APRS 144.39</button>
            <button class="preset-btn" onclick="p(145)">2m 145</button>
            <button class="preset-btn" onclick="p(168)">VHF 168</button>
            <button class="preset-btn" onclick="p(245)">สื่อสาร 245</button>
            <span class="preset-group-label">FM:</span>
            <button class="preset-btn" onclick="p(98)">FM 98</button>
            <span class="preset-group-label">HF:</span>
            <button class="preset-btn" onclick="p(14.2)">14.2 MHz</button>
            <button class="preset-btn" onclick="p(7.2)">7.2 MHz</button>
          </div>
        </div>

        <!-- Material -->
        <div>
          <label class="field-label">2. วัสดุเสาอากาศ (Velocity Factor)</label>
          <div class="mat-selector" id="matSelector">
            <button class="mat-btn active" data-vf="0.96">ลวดทองแดง (0.96)</button>
            <button class="mat-btn" data-vf="0.98">ท่อทองแดง (0.98)</button>
            <button class="mat-btn" data-vf="0.96">อลูมิเนียม (0.96)</button>
            <button class="mat-btn" data-vf="0.95">เหล็ก (0.95)</button>
            <button class="mat-btn" data-vf="0.82">Coax RG-58 (0.82)</button>
            <button class="mat-btn" data-vf="0.66">Coax RG-174 (0.66)</button>
          </div>
          <div id="vfDisplay" style="font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--accent2);margin-top:0.5rem">
            Velocity Factor = 0.96
          </div>
        </div>
      </div>

      <!-- Antenna type -->
      <label class="field-label">3. เลือกประเภทเสาอากาศ <span style="font-size:0.65rem;color:var(--text-dim);font-family:'Share Tech Mono',monospace">(กรอกความถี่ใหม่เพื่อรับคำแนะนำอีกครั้ง)</span></label>
      <div class="type-grid" id="typeGrid">
        <button class="ant-btn" data-type="dipole">Dipole<span class="ant-tag">½λ | 73Ω</span><span class="diff">⭐ ง่ายมาก</span></button>
        <button class="ant-btn" data-type="monopole">Monopole<span class="ant-tag">¼λ | 36Ω</span><span class="diff">⭐ ง่ายมาก</span></button>
        <button class="ant-btn active" data-type="inverted-v">Inverted V<span class="ant-tag">½λ | ~50Ω</span><span class="diff">⭐ ง่ายมาก</span></button>
        <button class="ant-btn" data-type="vdipole">V-Dipole<span class="ant-tag">½λ ดาวเทียม</span><span class="diff">⭐ ง่ายมาก</span></button>
        <button class="ant-btn" data-type="jpole">J-Pole<span class="ant-tag">¾λ | 50Ω</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="slim-jim">Slim Jim<span class="ant-tag">¾λ | 50Ω</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="5-8">5/8 Lambda<span class="ant-tag">⅝λ | ~50Ω</span><span class="diff">⭐⭐⭐ ยากกว่า</span></button>
        <button class="ant-btn" data-type="collinear">Collinear<span class="ant-tag">Coax | 50Ω</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="yagi-3">Yagi 3-el<span class="ant-tag">ทิศทางเดียว</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="yagi-5">Yagi 5-el<span class="ant-tag">Gain สูงขึ้น</span><span class="diff">⭐⭐⭐ ยากกว่า</span></button>
        <button class="ant-btn" data-type="turnstile">Turnstile<span class="ant-tag">ดาวเทียม CP</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="qfh">QFH<span class="ant-tag">ดาวเทียม CP+</span><span class="diff">⭐⭐⭐ ยากกว่า</span></button>
        <button class="ant-btn" data-type="helical">Helical<span class="ant-tag">ดาวเทียม Gain</span><span class="diff">⭐⭐⭐ ยากกว่า</span></button>
        <button class="ant-btn" data-type="discone">Discone<span class="ant-tag">หลายย่าน</span><span class="diff">⭐⭐⭐ ยากกว่า</span></button>
        <button class="ant-btn" data-type="moxon">Moxon<span class="ant-tag">½λ compact</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="longwire">Long Wire<span class="ant-tag">HF ง่ายสุด</span><span class="diff">⭐ ง่ายมาก</span></button>
        <button class="ant-btn" data-type="efhw">EFHW<span class="ant-tag">HF multiband</span><span class="diff">⭐⭐ ปานกลาง</span></button>
        <button class="ant-btn" data-type="delta-loop">Delta Loop<span class="ant-tag">HF loop</span><span class="diff">⭐⭐ ปานกลาง</span></button>
      </div>

      <!-- Ready-made reference -->
      <div style="margin-top:1.25rem">
        <label class="field-label">🛒 เสาสำเร็จรูป — ข้อมูลอ้างอิง</label>
        <div class="type-grid" id="readyGrid">
          <button class="rdy-btn" data-type="r-discone">Discone<span class="ant-tag">FM–UHF ทุกย่าน</span></button>
          <button class="rdy-btn" data-type="r-diamond-x30">Diamond X30<span class="ant-tag">144+430 MHz</span></button>
          <button class="rdy-btn" data-type="r-diamond-x50">Diamond X50<span class="ant-tag">144+430 MHz</span></button>
          <button class="rdy-btn" data-type="r-nagoya">Nagoya NA-771<span class="ant-tag">144+430 MHz</span></button>
          <button class="rdy-btn" data-type="r-mla30">MLA-30 Loop<span class="ant-tag">0.5–30 MHz HF</span></button>
          <button class="rdy-btn" data-type="r-rtlsdr-dipole">RTL-SDR Dipole Kit<span class="ant-tag">ชุดที่มากับ V4</span></button>
          <button class="rdy-btn" data-type="r-patch">Active Patch<span class="ant-tag">GPS/L-Band</span></button>
          <button class="rdy-btn" data-type="r-telescopic">Telescopic<span class="ant-tag">ปรับหลายย่าน</span></button>
        </div>
        <div id="readyInfo" style="display:none;margin-top:1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1.25rem"></div>
      </div>

    </div><!-- /input-area -->

    <div class="result-area" id="resultArea">
      <!-- Left -->
      <div>
        <div class="diagram-box">
          <div class="diagram-title" id="diagTitle"></div>
          <div id="diagContainer"></div>
        </div>
        <div class="lambda-banner" id="lambdaBanner"></div>
        <div style="margin-top:1.5rem">
          <div class="info-badges" id="infoBadges"></div>
          <h4 class="summary-title" id="summaryTitle">// รายการตัดวัสดุ</h4>
          <table class="summary-table" id="summaryTable"></table>
        </div>
      </div>
      <!-- Right -->
      <div id="feedBox"></div>
    </div>

  </div><!-- /calc-box -->
</section>

<script>
let currentUnit = 'MHz';
let currentVF = 0.96;
let currentType = 'inverted-v';

// ── Utilities ──
function getMHz() {
  const v = parseFloat(document.getElementById('freqInput').value);
  if (!v || v <= 0) return null;
  return currentUnit === 'kHz' ? v / 1000 : v;
}

function setUnit(u) {
  const inp = document.getElementById('freqInput');
  const v = parseFloat(inp.value);
  if (!isNaN(v) && v > 0) {
    inp.value = u === 'kHz' ? (currentUnit === 'MHz' ? (v*1000).toFixed(1) : v) : (currentUnit === 'kHz' ? (v/1000).toFixed(4) : v);
  }
  currentUnit = u;
  document.getElementById('unitDisplay').textContent = u;
  document.getElementById('btnMHz').classList.toggle('active', u === 'MHz');
  document.getElementById('btnKHz').classList.toggle('active', u === 'kHz');
  userOverrideType = false; // unit เปลี่ยน → แนะนำใหม่
  calc();
}

function p(mhz) {
  currentUnit = 'MHz';
  document.getElementById('unitDisplay').textContent = 'MHz';
  document.getElementById('btnMHz').classList.add('active');
  document.getElementById('btnKHz').classList.remove('active');
  document.getElementById('freqInput').value = mhz;
  userOverrideType = false; // preset กด → แนะนำใหม่
  calc();
}

// Material selector
document.getElementById('matSelector').addEventListener('click', e => {
  if (e.target.classList.contains('mat-btn')) {
    document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentVF = parseFloat(e.target.dataset.vf);
    document.getElementById('vfDisplay').textContent = `Velocity Factor = ${currentVF}`;
    calc();
  }
});

// Type selector
document.getElementById('typeGrid').addEventListener('click', e => {
  const btn = e.target.closest('.ant-btn');
  if (btn) {
    document.querySelectorAll('.ant-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    userOverrideType = true; // user เลือกเองแล้ว หยุด auto-recommend
    // Clear ready-made
    document.getElementById('readyInfo').style.display = 'none';
    document.querySelectorAll('.rdy-btn').forEach(b => b.classList.remove('active'));
    calc();
  }
});

document.getElementById('freqInput').addEventListener('input', () => {
  userOverrideType = false; // frequency เปลี่ยน → auto-recommend ใหม่
  calc();
});

// ── SVG helpers ──
const coaxSVG = (x,y,s=1) => `<g transform="translate(${x} ${y}) scale(${s})">
  <rect x="-10" y="0" width="20" height="30" rx="2" class="coax-outer"/>
  <rect x="-7" y="0" width="14" height="25" class="coax-shield"/>
  <rect x="-5" y="0" width="10" height="20" class="coax-diel"/>
  <rect x="-2" y="0" width="4" height="15" class="coax-center"/>
</g>`;

function dimH(x1,y,x2,label,above=true) {
  const yL = above ? y-12 : y+18;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="dim-line"/>
  <polygon points="${x1},${y} ${x1+8},${y-4} ${x1+8},${y+4}" class="dim-arrow"/>
  <polygon points="${x2},${y} ${x2-8},${y-4} ${x2-8},${y+4}" class="dim-arrow"/>
  <text x="${(x1+x2)/2}" y="${yL}" class="dim-text">${label}</text>`;
}
function dimV(x,y1,y2,label,right=true) {
  const xL = right ? x+42 : x-42;
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="dim-line"/>
  <polygon points="${x},${y1} ${x-4},${y1+8} ${x+4},${y1+8}" class="dim-arrow"/>
  <polygon points="${x},${y2} ${x-4},${y2-8} ${x+4},${y2-8}" class="dim-arrow"/>
  <text x="${xL}" y="${(y1+y2)/2+5}" class="dim-text">${label}</text>`;
}

// ── Ready-made click handler ──
document.getElementById('readyGrid').addEventListener('click', e => {
  const btn = e.target.closest('.rdy-btn');
  if (!btn) return;
  // Deselect DIY buttons
  document.querySelectorAll('.ant-btn').forEach(b => b.classList.remove('active'));
  // Toggle ready button
  const wasActive = btn.classList.contains('active');
  document.querySelectorAll('.rdy-btn').forEach(b => b.classList.remove('active'));
  const box = document.getElementById('readyInfo');
  if (wasActive) {
    box.style.display = 'none';
    // Restore last DIY type
    document.querySelectorAll('.ant-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.type === currentType);
    });
    return;
  }
  btn.classList.add('active');
  const d = READY[btn.dataset.type];
  if (d) {
    // Hide DIY result area content but keep area visible for ready info
    document.getElementById('resultArea').classList.add('show');
    box.style.display = 'block';
    const svgFns = {
      'r-discone': svgReadyDiscone,
      'r-diamond-x30': svgReadyDiamondX30,
      'r-diamond-x50': svgReadyDiamondX50,
      'r-nagoya': svgReadyNagoya,
      'r-mla30': svgReadyMLA30,
      'r-rtlsdr-dipole': svgReadyDipoleKit,
      'r-patch': svgReadyPatch,
      'r-telescopic': svgReadyTelescopic,
    };
    const svgHtml = svgFns[btn.dataset.type] ? svgFns[btn.dataset.type]() : '';
    box.innerHTML = `
      <div class="rdy-info-title">📡 ${d.name}</div>
      <p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:0.75rem">${d.desc}</p>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:center">${svgHtml}</div>
      ${d.rows.map(r=>`<div class="rdy-row"><span class="rdy-k">${r.k}</span><span class="rdy-v">${r.v}</span></div>`).join('')}`;
    // Scroll to info
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
});


// ── Main calculation ──
function getRecommendedAntenna(mhz) {
  if (mhz < 0.5) return null;
  if (mhz < 30) return 'longwire';        // HF — Long Wire ง่ายที่สุด
  if (mhz < 88) return 'dipole';          // VHF ต่ำ
  if (mhz <= 108) return 'dipole';        // FM Broadcast
  if (mhz <= 136) return 'dipole';        // วิทยุเครื่องบิน
  if (mhz <= 138.5) return 'vdipole';     // NOAA/Meteor ดาวเทียม
  if (mhz <= 174) return 'jpole';         // VHF สื่อสาร
  if (mhz <= 300) return 'jpole';         // VHF/UHF
  if (mhz <= 500) return 'jpole';         // UHF
  if (mhz <= 960) return 'collinear';     // UHF สูง/ISM
  if (mhz <= 1100) return 'collinear';    // ADS-B 1090
  return 'collinear';                     // L-Band+
}

let userOverrideType = false; // flag ว่า user เลือกเองหรือยัง

function calc() {
  const mhz = getMHz();
  const resultArea = document.getElementById('resultArea');
  if (!mhz) { resultArea.classList.remove('show'); return; }

  // Auto-recommend antenna type (only if user hasn't manually overridden)
  if (!userOverrideType) {
    const rec = getRecommendedAntenna(mhz);
    if (rec && rec !== currentType) {
      currentType = rec;
      document.querySelectorAll('.ant-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === rec);
      });
    }
  }

  // Clear ready-made info when DIY is active
  document.getElementById('readyInfo').style.display = 'none';
  document.querySelectorAll('.rdy-btn').forEach(b => b.classList.remove('active'));

    summaryData = [
      {k:'<strong>ความยาวขั้นต่ำ (½λ)</strong>',v:minLen,u:'cm'},
      {k:'แนะนำ (1λ)',v:rec1,u:'cm'},
      {k:'ดีกว่า (2λ)',v:rec2,u:'cm'},
      {k:'ทิศทาง',v:'แนวนอน ยิ่งยาวยิ่งดี',u:''},
      {k:'ต้องใช้',v:'Matching Transformer หรือ ATU',u:''},
      {k:'Direct Sampling',v:'Q Branch (ต้องเปิด สำหรับ HF)',u:''},
    ];
    diagSVG = svgLongWire(rec1 > 400 ? 400 : rec1);
    feedKey = 'longwire';
  }
  else if (t === 'efhw') {
    const halfWave = lambda_vf_m/2*100;
    title = `EFHW (End-Fed Half Wave) @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~2400Ω → 49:1 → 50Ω'},{cls:'badge-diff',txt:'⭐⭐ ปานกลาง'},{cls:'badge-use',txt:'HF Multi-band'}];
    sTitle = '// ความยาวและสัดส่วน';
    summaryData = [
      {k:'<strong>ความยาวสาย (½λ)</strong>',v:halfWave,u:'cm'},
      {k:'ต้องมี Matching Transformer',v:'49:1 Unun',u:''},
      {k:'สายป้อน (Feedline)',v:'Coax 50Ω ต่อจาก Unun',u:''},
      {k:'ข้อดี',v:'ต่อสายปลายเดียว ใช้ได้หลายย่าน (harmonic)',u:''},
      {k:'Direct Sampling',v:'Q Branch (ต้องเปิด สำหรับ HF)',u:''},
    ];
    diagSVG = svgEFHW(halfWave > 500 ? 500 : halfWave);
    feedKey = 'efhw';
  }
  else if (t === 'delta-loop') {
    const side = lambda_vf_m/3*100;
    const total = side * 3;
    title = `Delta Loop @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~100Ω (50Ω ผ่าน ¼λ transformer)'},{cls:'badge-diff',txt:'⭐⭐ ปานกลาง'},{cls:'badge-use',txt:'HF Gain ดีกว่า Dipole'}];
    summaryData = [
      {k:'<strong>ความยาวด้านแต่ละด้าน (×3)</strong>',v:side,u:'cm'},
      {k:'ความยาวรวมเส้นรอบวง (1λ)',v:total,u:'cm'},
      {k:'รูปร่าง',v:'สามเหลี่ยมด้านเท่า',u:''},
      {k:'Feed Point',v:'มุมล่างด้านใดด้านหนึ่ง',u:''},
      {k:'Matching',v:'¼λ 75Ω transformer หรือ Balun 2:1',u:''},
    ];
    diagSVG = svgDeltaLoop(side > 300 ? 300 : side);
    feedKey = 'deltaloop';
  }
  else if (t === 'collinear') {
    const radiating = lambda_vf_m/2*100;
    const stub = lambda_vf_m/4*100;
    title = `Co-ax Collinear @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~50Ω'},{cls:'badge-diff',txt:'⭐⭐ ปานกลาง'},{cls:'badge-use',txt:'ADS-B 1090 / VHF'}];
    summaryData = [{k:'<strong>ความยาวท่อน Radiating (×3+)</strong>',v:radiating,u:'cm'},{k:'ความยาว Phasing Stub',v:stub,u:'cm'},{k:'หมายเหตุ',v:'ใช้ VF ของสาย Coax ที่เลือก',u:''}];
    diagSVG = svgCollinear(radiating, stub);
    feedKey = 'collinear';
  }
  else if (t === 'yagi-3') {
    const ref = (152/mhz)*100;
    const drv = (143/mhz)*100;
    const dir = (137/mhz)*100;
    const sp = lambda_m*0.2*100;
    title = `Yagi 3-el @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~50Ω'},{cls:'badge-diff',txt:'⭐⭐ ปานกลาง'},{cls:'badge-use',txt:'FM / VHF ทิศทางเดียว'}];
    summaryData = [{k:'<strong>Reflector (หลังสุด)</strong>',v:ref,u:'cm'},{k:'<strong>Driven Element (กลาง)</strong>',v:drv,u:'cm'},{k:'<strong>Director (หน้าสุด)</strong>',v:dir,u:'cm'},{k:'ระยะห่างระหว่างชิ้น',v:sp,u:'cm'},{k:'ความยาว Boom (โดยประมาณ)',v:sp*2.2,u:'cm'}];
    diagSVG = svgYagi(ref,drv,dir,sp,3);
    feedKey = 'yagi';
  }
  else if (t === 'yagi-5') {
    const ref = (152/mhz)*100;
    const drv = (143/mhz)*100;
    const dir1 = (137/mhz)*100;
    const dir2 = (134/mhz)*100;
    const dir3 = (131/mhz)*100;
    const sp = lambda_m*0.2*100;
    title = `Yagi 5-el @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~50Ω'},{cls:'badge-diff',txt:'⭐⭐⭐ ยากกว่า'},{cls:'badge-use',txt:'VHF Gain สูง ทิศทางเดียว'}];
    summaryData = [{k:'<strong>Reflector</strong>',v:ref,u:'cm'},{k:'<strong>Driven Element</strong>',v:drv,u:'cm'},{k:'<strong>Director 1</strong>',v:dir1,u:'cm'},{k:'Director 2',v:dir2,u:'cm'},{k:'Director 3',v:dir3,u:'cm'},{k:'ระยะห่างระหว่างชิ้น',v:sp,u:'cm'},{k:'ความยาว Boom',v:sp*4.2,u:'cm'}];
    diagSVG = svgYagi5(ref,drv,dir1,dir2,dir3,sp);
    feedKey = 'yagi';
  }
  else if (t === 'turnstile') {
    const arm = lambda_vf_m/4*100;
    const phaseLine = lambda_vf_m/4*100;
    title = `Turnstile @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~25Ω (ต้องใช้ Matching)'},{cls:'badge-diff',txt:'⭐⭐ ปานกลาง'},{cls:'badge-use',txt:'Meteor/NOAA ดาวเทียม'}];
    summaryData = [{k:'<strong>ความยาวแขน Dipole แต่ละข้าง (×4)</strong>',v:arm,u:'cm'},{k:'ความยาว Phasing Line (¼λ ในสาย)',v:phaseLine,u:'cm'},{k:'การวาง',v:'Dipole 2 ตัว ตั้งฉากกัน 90°',u:''},{k:'Matching',v:'Balun 1:2 (impedance transformer)',u:''}];
    diagSVG = svgTurnstile(arm);
    feedKey = 'turnstile';
  }
  else if (t === 'qfh') {
    const height = lambda_m*0.446*100;
    const longLoop = lambda_m*0.562*100;
    const shortLoop = lambda_m*0.542*100;
    const diam = lambda_m*0.141*100;
    title = `QFH @ ${fmt(mhz)} MHz`;
    badges = [{cls:'badge-imp',txt:'Impedance ~50–75Ω'},{cls:'badge-diff',txt:'⭐⭐⭐ ยากกว่า'},{cls:'badge-use',txt:'Meteor/NOAA ดาวเทียม (ดีที่สุด)'}];
    sTitle = '// ขนาดและสัดส่วน';
    summaryData = [{k:'<strong>ความยาว Loop ยาว (×2)</strong>',v:longLoop,u:'cm'},{k:'<strong>ความยาว Loop สั้น (×2)</strong>',v:shortLoop,u:'cm'},{k:'ความสูงโดยรวม',v:height,u:'cm'},{k:'เส้นผ่านศูนย์กลางโครง',v:diam,u:'cm'}];
    diagSVG = svgQFH(height, diam);
    feedKey = 'qfh';
  }

  // Render
  document.getElementById('diagTitle').textContent = title;
  document.getElementById('diagContainer').innerHTML = diagSVG;
  document.getElementById('summaryTitle').innerHTML = sTitle;
  document.getElementById('summaryTable').innerHTML = summaryData.map(r=>`<tr><td class="key">${r.k}</td><td class="val">${typeof r.v==='number'?r.v.toFixed(2):r.v}<span class="unit">${r.u}</span></td></tr>`).join('');
  // Add recommendation notice if auto-selected
  const recBadge = userOverrideType ? '' : `<span class="badge" style="background:rgba(255,200,0,0.1);color:var(--yellow);border:1px solid rgba(255,200,0,0.3)">⭐ แนะนำสำหรับ ${fmt(mhz)} MHz</span>`;
  document.getElementById('infoBadges').innerHTML = recBadge + badges.map(b=>`<span class="badge ${b.cls}">${b.txt}</span>`).join('');

  // Feed box
  const fd = FEED[feedKey];
  if (fd) {
    document.getElementById('feedBox').innerHTML = `
      <div class="feed-box">
        <h3>การเชื่อมต่อสาย: ${fd.title}</h3>
        <div class="feed-content">
          <p>${fd.desc}</p>
          <ul>${fd.points.map(p=>`<li>${p}</li>`).join('')}</ul>
          ${fd.tip ? `<div class="tip-box">${fd.tip}</div>` : ''}
        </div>
        <div class="feed-svg-wrap">${fd.svg}</div>
      </div>`;
  }

  resultArea.classList.add('show');
}

// ── Format helpers ──
function fmt(n) { return n >= 1000 ? n.toFixed(0) : n >= 100 ? n.toFixed(1) : n.toFixed(3); }
function fmtLen(cm) {
  if (cm >= 100) return (cm/100).toFixed(2) + ' m';
  return cm.toFixed(1) + ' cm';
}

// ── SVG renderers ──

function svgJPole(A,B,C,D) {
  const sc = Math.min(180/A, 1);
  const ah = A*sc, bh = B*sc, ch = C*sc < 15 ? 15 : C*sc, dh = D*sc;
  const x1=120, x2=x1+ch, top=15, bot=top+ah, sBot=top+ah-bh;
  return `<svg viewBox="0 0 280 ${ah+40}">
    <line x1="${x1}" y1="${top}" x2="${x1}" y2="${bot}" class="ant-el ant-driven"/>
    <line x1="${x1}" y1="${bot}" x2="${x2}" y2="${bot}" class="ant-el ant-driven"/>
    <line x1="${x2}" y1="${sBot}" x2="${x2}" y2="${bot}" class="ant-el ant-driven"/>
    ${dimV(55,top,bot,'A: '+A.toFixed(1),true)}
    ${dimV(220,sBot,bot,'B: '+B.toFixed(1),true)}
    <circle cx="${x1}" cy="${bot-dh}" r="4" fill="var(--accent2)"/>
    <text x="${x1-35}" y="${bot-dh+4}" class="dim-text" style="text-anchor:end">D: ${D.toFixed(1)}</text>
    <text x="${(x1+x2)/2}" y="${bot+18}" class="ant-label">C: ${C.toFixed(1)} cm</text>
  </svg>`;
}

function svgYagi(ref,drv,dir,sp,els) {
  const sc = Math.min(200/ref, 1);
  const cx=200, cy=125, sp2=sp*sc*0.7;
  const x1=cx-sp2, x2=cx, x3=cx+sp2;
  const rh=ref*sc/2, dh=drv*sc/2, dih=dir*sc/2;
  return `<svg viewBox="0 0 400 250">
    <line x1="${x1-10}" y1="${cy}" x2="${x3+10}" y2="${cy}" class="ant-boom"/>
    <line x1="${x1}" y1="${cy-rh}" x2="${x1}" y2="${cy+rh}" class="ant-el ant-ref"/>
    <text x="${x1}" y="${cy-rh-8}" class="ant-label">Reflector</text>
    <text x="${x1}" y="${cy+rh+16}" class="ant-label">${ref.toFixed(1)}cm</text>
    <line x1="${x2}" y1="${cy-dh}" x2="${x2}" y2="${cy-4}" class="ant-el ant-driven"/>
    <line x1="${x2}" y1="${cy+4}" x2="${x2}" y2="${cy+dh}" class="ant-el ant-driven"/>
    <text x="${x2}" y="${cy-dh-8}" class="ant-label">Driven</text>
    <text x="${x2}" y="${cy+dh+16}" class="ant-label">${drv.toFixed(1)}cm</text>
    <line x1="${x3}" y1="${cy-dih}" x2="${x3}" y2="${cy+dih}" class="ant-el ant-dir"/>
    <text x="${x3}" y="${cy-dih-8}" class="ant-label">Director</text>
    <text x="${x3}" y="${cy+dih+16}" class="ant-label">${dir.toFixed(1)}cm</text>
    <circle cx="${x2}" cy="${cy}" r="5" fill="var(--accent2)"/>
    <text x="${x2+15}" y="${cy-8}" class="ant-label" style="fill:var(--accent2)">Feed</text>
    ${dimH(x1,cy+50,x2,sp.toFixed(1)+'cm',false)}
    ${dimH(x2,cy+50,x3,sp.toFixed(1)+'cm',false)}
    <text x="${cx+140}" y="${cy}" class="ant-label">→ รับ</text>
  </svg>`;
}

function svgYagi5(ref,drv,d1,d2,d3,sp) {
  const sc = Math.min(190/ref, 1);
  const cy=115, sp2=sp*sc*0.55;
  const xs = [200-sp2*2, 200-sp2, 200, 200+sp2, 200+sp2*2];
  const lens = [ref,drv,d1,d2,d3];
  const colors = ['ant-ref','ant-driven','ant-dir','ant-dir','ant-dir'];
  const labels = ['Ref','Drv','D1','D2','D3'];
  let svg = `<svg viewBox="0 0 420 230"><line x1="${xs[0]-10}" y1="${cy}" x2="${xs[4]+10}" y2="${cy}" class="ant-boom"/>`;
  lens.forEach((l,i)=>{
    const h=l*sc/2;
    const gap = i===1?4:0;
    svg += `<line x1="${xs[i]}" y1="${cy-h}" x2="${xs[i]}" y2="${cy-gap}" class="ant-el ${colors[i]}"/>`;
    if(i===1) svg += `<line x1="${xs[i]}" y1="${cy+gap}" x2="${xs[i]}" y2="${cy+h}" class="ant-el ${colors[i]}"/>`;
    else svg += `<line x1="${xs[i]}" y1="${cy}" x2="${xs[i]}" y2="${cy+h}" class="ant-el ${colors[i]}"/>`;
    svg += `<text x="${xs[i]}" y="${cy-h-7}" class="ant-label">${labels[i]}</text>`;
    svg += `<text x="${xs[i]}" y="${cy+h+15}" class="ant-label">${l.toFixed(0)}cm</text>`;
  });
  svg += `<circle cx="${xs[1]}" cy="${cy}" r="5" fill="var(--accent2)"/><text x="${xs[4]+20}" y="${cy+4}" class="ant-label">→ รับ</text></svg>`;
  return svg;
}

function svgHelical(diam, spacing, total) {
  const cx=200, sc=Math.min(160/total, 0.8);
  const pts = [];
  for(let i=0;i<=10;i++){
    const a=i*Math.PI*2; const y=25+i*(spacing*sc*0.85);
    pts.push(`${cx+Math.cos(a)*diam*sc*0.6},${y}`);
  }
  return `<svg viewBox="0 0 400 220">
    <polyline points="${pts.join(' ')}" class="ant-el ant-driven" style="stroke-width:3"/>
    <rect x="${cx-diam*sc}" y="${180}" width="${diam*sc*2}" height="8" rx="2" class="coax-shield"/>
    <text x="${cx}" y="200" class="ant-label">Ground Plane ⌀ ${(diam*0.7).toFixed(1)}cm</text>
    <text x="${cx}" y="215" class="ant-label">~10 รอบ, ระยะห่าง ${spacing.toFixed(1)}cm/รอบ</text>
    <circle cx="${pts[0].split(',')[0]}" cy="25" r="4" fill="var(--accent2)"/>
    <text x="${cx+80}" y="30" class="ant-label" style="fill:var(--accent2)">Feed</text>
  </svg>`;
}

function svgDiscone(upper) {
  const sc=Math.min(100/upper, 1.2), cx=200, cy=80;
  const discR=upper*sc*0.7, coneL=upper*sc;
  const coneSpread=coneL*Math.sin(60*Math.PI/180);
  return `<svg viewBox="0 0 400 230">
    <ellipse cx="${cx}" cy="${cy-5}" rx="${discR}" ry="${discR*0.25}" class="ant-el" style="stroke:var(--accent3)"/>
    <text x="${cx}" y="${cy-discR*0.25-8}" class="ant-label" style="fill:var(--accent3)">Disc (จาน)</text>
    ${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${cx+Math.cos(a*Math.PI/180)*discR*0.1}" y1="${cy+8}" x2="${cx+Math.cos(a*Math.PI/180)*coneSpread}" y2="${cy+8+coneL*Math.cos(30*Math.PI/180)}" class="ant-el ant-ref" style="stroke-width:2"/>`).join('')}
    <text x="${cx}" y="${cy+coneL*0.7+20}" class="ant-label">Cone กรวย (60°)</text>
    <circle cx="${cx}" cy="${cy+5}" r="4" fill="var(--accent2)"/>
    <text x="${cx+80}" y="${cy+5}" class="ant-label" style="fill:var(--accent2)">Feed (ช่องว่างเล็กมาก)</text>
  </svg>`;
}

function svgMoxon(width, height, gap) {
  const sc=Math.min(150/width, 1.5), cx=200, cy=100;
  const w=width*sc, h=height*sc, g=Math.max(gap*sc,5);
  return `<svg viewBox="0 0 400 220">
    <line x1="${cx-w}" y1="${cy-h}" x2="${cx-w}" y2="${cy}" class="ant-el ant-driven"/>
    <line x1="${cx-w}" y1="${cy-h}" x2="${cx}" y2="${cy-h}" class="ant-el ant-driven"/>
    <line x1="${cx}" y1="${cy-h}" x2="${cx+w}" y2="${cy-h}" class="ant-el ant-ref"/>
    <line x1="${cx+w}" y1="${cy-h}" x2="${cx+w}" y2="${cy}" class="ant-el ant-ref"/>
    <line x1="${cx-w}" y1="${cy+g}" x2="${cx-w}" y2="${cy+h}" class="ant-el ant-driven"/>
    <line x1="${cx-w}" y1="${cy+h}" x2="${cx}" y2="${cy+h}" class="ant-el ant-driven"/>
    <line x1="${cx}" y1="${cy+h}" x2="${cx+w}" y2="${cy+h}" class="ant-el ant-ref"/>
    <line x1="${cx+w}" y1="${cy+g}" x2="${cx+w}" y2="${cy+h}" class="ant-el ant-ref"/>
    <circle cx="${cx-w}" cy="${cy-h/2}" r="4" fill="var(--accent2)"/>
    <text x="${cx-w-35}" y="${cy-h/2+4}" class="ant-label" style="fill:var(--accent2)">Feed</text>
    <text x="${cx}" y="${cy+h+18}" class="ant-label" style="fill:var(--accent3)">Driven</text>
    <text x="${cx}" y="${cy-h-10}" class="ant-label">Reflector</text>
    <text x="${cx+w+30}" y="${cy+5}" class="dim-text">Gap</text>
  </svg>`;
}

function svgLongWire(lenCm) {
  return `<svg viewBox="0 0 400 120">
    <line x1="20" y1="50" x2="300" y2="50" class="ant-el ant-driven" style="stroke-width:3"/>
    <text x="160" y="38" class="ant-label">ยาวเท่าไหร่ก็ได้ (ยิ่งยาวยิ่งดี)</text>
    <text x="160" y="80" class="ant-label">${lenCm.toFixed(0)} cm (½λ)</text>
    <rect x="300" y="35" width="40" height="30" rx="4" fill="none" stroke="var(--accent2)" stroke-width="2"/>
    <text x="320" y="54" class="ant-label" style="fill:var(--accent2)">9:1</text>
    <line x1="340" y1="50" x2="380" y2="50" class="wire"/>
    <text x="360" y="68" class="ant-label">Coax</text>
    <text x="20" y="100" class="ant-label">ปลายสาย</text>
  </svg>`;
}

function svgEFHW(lenCm) {
  return `<svg viewBox="0 0 400 130">
    <line x1="20" y1="55" x2="280" y2="55" class="ant-el ant-driven" style="stroke-width:3"/>
    <text x="150" y="43" class="ant-label">½λ = ${lenCm.toFixed(0)} cm</text>
    <text x="150" y="85" class="ant-label">(ใช้ได้หลายย่าน harmonic)</text>
    <rect x="280" y="40" width="50" height="30" rx="4" fill="none" stroke="var(--accent2)" stroke-width="2"/>
    <text x="305" y="58" class="ant-label" style="fill:var(--accent2)">49:1</text>
    <text x="305" y="70" class="ant-label" style="fill:var(--accent2)">Unun</text>
    <line x1="330" y1="55" x2="380" y2="55" class="wire"/>
    <text x="355" y="73" class="ant-label">Coax</text>
    <line x1="280" y1="70" x2="280" y2="110" class="wire-sh"/>
    <text x="265" y="118" class="ant-label">GND</text>
  </svg>`;
}

function svgDeltaLoop(side) {
  const sc=Math.min(150/side,1.5), cx=200, top=20, bot=top+side*sc*0.87;
  return `<svg viewBox="0 0 400 220">
    <line x1="${cx}" y1="${top}" x2="${cx-side*sc*0.5}" y2="${bot}" class="ant-el ant-ref"/>
    <line x1="${cx}" y1="${top}" x2="${cx+side*sc*0.5}" y2="${bot}" class="ant-el ant-ref"/>
    <line x1="${cx-side*sc*0.5}" y1="${bot}" x2="${cx-4}" y2="${bot}" class="ant-el ant-driven"/>
    <line x1="${cx+4}" y1="${bot}" x2="${cx+side*sc*0.5}" y2="${bot}" class="ant-el ant-driven"/>
    <circle cx="${cx}" cy="${bot}" r="5" fill="var(--accent2)"/>
    <text x="${cx}" y="${bot+18}" class="ant-label" style="fill:var(--accent2)">Feed Point</text>
    <text x="${cx}" y="${top-8}" class="ant-label">ยึดจุดบนสุด</text>
    ${dimV(cx+side*sc*0.5+30, top, bot, side.toFixed(1)+'cm')}
    <text x="${cx}" y="${bot+32}" class="ant-label">ด้านละ ${side.toFixed(1)} cm × 3 ด้าน</text>
  </svg>`;
}

// Init
calc();
</script>
